name: Export CRM ZIP Final

on:
  push:
    branches: [export-zip-20261001-final]

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Upload clean CRM source
        uses: actions/upload-artifact@v4
        with:
          name: El-Arbol-CRM-Actualizado
          include-hidden-files: true
          path: |
            .
            !.git/**
            !el-arbol-pos---pizzeria*.zip
          retention-days: 1
